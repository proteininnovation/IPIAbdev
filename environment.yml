# ══════════════════════════════════════════════════════════════════════════════
# DELPHI — Conda Environment
# Institute for Protein Innovation (IPI)
#
# Create environment:
#   conda env create -f environment.yml
#   conda activate delphi
#
# Update existing environment:
#   conda env update -f environment.yml --prune
#
# Versions pinned to the environment used for the manuscript results.
# ══════════════════════════════════════════════════════════════════════════════

name: delphi

channels:
  - bioconda        # for anarci + hmmer
  - conda-forge     # for up-to-date packages
  - defaults

dependencies:
  - python=3.11.15
  - pip

  # ── ANARCI + HMMER (installed explicitly to guarantee hmmer is present) ────
  - bioconda::hmmer=3.4          # HMM-based sequence alignment (required by ANARCI)
  - bioconda::anarci=2024.05.21  # CDR numbering (ANARCI 1.3; depends on hmmer)

  # ── All pip packages ────────────────────────────────────────────────────────
  - pip:
    # Data handling
    - numpy==2.4.6
    - pandas==2.3.3
    - scipy==1.17.1
    - openpyxl==3.1.5
    - pyyaml==6.0.3
    - biopython==1.87

    # ML frameworks
    - torch==2.12.1
    - scikit-learn==1.9.0
    - xgboost==2.1.1
    - joblib==1.5.3

    # Interpretability
    - captum==0.9.0
    - shap==0.51.0

    # Visualisation
    - matplotlib==3.11.0
    - seaborn==0.13.2
    - python-pptx==1.0.2

    # Sequence utilities
    - Levenshtein==0.27.3
    - tqdm==4.68.3

    # Protein language models
    - ablang2==0.2.1
    - antiberty==0.1.3
    - transformers==4.57.6
    - peft==0.19.1
    - tf-keras==2.21.0

    # Experiment tracking
    - mlflow==3.14.0
