    target:          psr_filter
    lm:              igbert
    model:           transformer_lm
    model_path:      build/pretrained_models/FINAL_psr_filter_igbert_transformer_lm_ipi_psr_trainset.pt
    type:            full_train
    trained_at:      "2026-05-19 16:45:00"
    kfold_auc:       0.9102
    kfold_std:       0.0198
    kfold_folds:     10
    kfold_best_fold: 2
    threshold:       0.4621
    epochs:          28
    notes:           "LoRA fine-tuned on GPU"

  # ── Example 4: best_fold entry — model_id and model_path differ ───────────
