    model_path:      build/pretrained_models/FINAL_psr_filter_onehot_transformer_onehot_ipi_psr_trainset_20260410.pt
    type:            full_train
    trained_at:      "2026-04-10 09:15:00"
    kfold_auc:       0.8634
    kfold_std:       0.0401
    kfold_folds:     10
    kfold_best_fold: 7
